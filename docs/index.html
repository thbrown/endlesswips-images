<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>endlesswips — Image Admin</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header>
    <h1>endlesswips images</h1>
    <div id="auth-area">
      <div id="signin-btn">
        <div id="g_id_signin"></div>
      </div>
      <div id="user-info" class="hidden">
        <img id="user-avatar" src="" alt="avatar" />
        <span id="user-email"></span>
        <button id="signout-btn" onclick="signOut()">Sign out</button>
      </div>
    </div>
  </header>

  <main id="main-content" class="hidden">
    <section id="upload-section">
      <div id="upload-zone" tabindex="0" role="button" aria-label="Upload images">
        <p>Drag &amp; drop images here, or click to select</p>
        <p class="subtext">Converts to WebP automatically</p>
        <input type="file" id="file-input" multiple accept="image/*" />
      </div>
      <div id="progress-bar-wrap" class="hidden">
        <div id="progress-bar"></div>
      </div>
      <p id="upload-status"></p>
    </section>

    <section id="gallery-section">
      <div id="stats-bar" class="hidden">
        <span id="stat-count"></span>
        <span class="stat-divider">·</span>
        <span id="stat-size"></span>
      </div>
      <div id="image-grid"></div>
    </section>
  </main>

  <div id="lightbox" class="hidden" role="dialog" aria-modal="true">
    <div id="lightbox-backdrop"></div>
    <div id="lightbox-content">
      <img id="lightbox-img" src="" alt="" />
      <button id="lightbox-close" aria-label="Close">&times;</button>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
